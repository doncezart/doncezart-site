<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Error reporting for old browsers; ?diag shows a panel (static/diag.js). -->
		<!-- Bump ?v= on every change: the file name has no hash, so the CDN caches it. -->
		<script src="%sveltekit.assets%/diag.js?v=2"></script>

		<link rel="stylesheet" href="%sveltekit.assets%/css/tokens.css" />
		<link rel="stylesheet" href="%sveltekit.assets%/css/global.css" />

		<link rel="preload" href="%sveltekit.assets%/fonts/satoshi-variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/clash-display-variable.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="stylesheet" href="%sveltekit.assets%/css/fonts.css" />

		<meta name="theme-color" content="#000000" />
		<!-- Title, description and share previews: $lib/components/Seo.svelte, per page. -->

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
