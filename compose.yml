# Local development database only.
# In production this whole file is ignored — point DATABASE_URL at your managed PG.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doncezart
      POSTGRES_PASSWORD: doncezart
      POSTGRES_DB: doncezart
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Bind to loopback only — never expose Postgres on a public interface.
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doncezart -d doncezart"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
